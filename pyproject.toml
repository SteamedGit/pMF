[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# flaxmodels requests this backport unconditionally; Python 3.11 has it built in.
override-dependencies = ["dataclasses; python_version < '3.7'"]

# PyTorch is used for data loading and weight conversion; JAX provides CUDA.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
